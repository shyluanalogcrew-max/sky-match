<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Match</title>
<style>
:root{--bg:#14213d;--panel:#1d2f55;--face:#dbe7f3;--ink:#14213d;--accent:#f2b134;--ok:#3aa6a0;--text:#eef3fa;--muted:#9db0cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eff8;--panel:#d3deee;--face:#14213d;--ink:#f2f6fc;--text:#14213d;--muted:#4a5d82}}
:root[data-theme="light"]{--bg:#e9eff8;--panel:#d3deee;--face:#14213d;--ink:#f2f6fc;--text:#14213d;--muted:#4a5d82}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Georgia,"Iowan Old Style",serif;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:520px}
h1{font-size:2.4rem;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
p.sub{margin:0 0 18px;color:var(--muted);font-size:1rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-family:system-ui,sans-serif;font-size:.9rem}
.stat{background:var(--panel);padding:8px 12px;border-radius:10px}
.stat b{font-variant-numeric:tabular-nums}
.sp{flex:1}
button{font:inherit;font-family:system-ui,sans-serif;font-size:.9rem;border:0;border-radius:10px;padding:8px 14px;background:var(--panel);color:var(--text);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#14213d;font-weight:600}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--cols),1fr)}
.card{aspect-ratio:3/4;perspective:600px;background:none;border:0;padding:0;border-radius:12px}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;display:block}
.card.up .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.b{background:var(--panel);border:2px solid var(--muted);color:var(--muted);font-size:1.4rem}
.f{background:var(--face);color:var(--ink);transform:rotateY(180deg);font-size:clamp(1.6rem,8vw,2.6rem)}
.card.ok .f{background:var(--ok);color:#fff}
.card.ok{pointer-events:none}
#win{position:fixed;inset:0;background:rgba(10,16,32,.8);display:none;align-items:center;justify-content:center;padding:20px}
#win.show{display:flex}
#win div{background:var(--bg);color:var(--text);border:2px solid var(--accent);border-radius:16px;padding:28px;text-align:center;max-width:320px}
#win h2{margin:0 0 8px;font-size:1.8rem}
#win p{margin:0 0 18px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Sky Match</h1>
  <p class="sub">Flip two cards. Find every matching pair of sky symbols.</p>
  <div class="bar">
    <span class="stat">Moves <b id="moves">0</b></span>
    <span class="stat">Time <b id="time">0:00</b></span>
    <span class="stat">Best <b id="best">-</b></span>
  </div>
  <div class="bar" id="levels">
    <button data-n="6" aria-pressed="false">Easy</button>
    <button data-n="8" aria-pressed="true">Normal</button>
    <button data-n="12" aria-pressed="false">Hard</button>
    <span class="sp"></span>
    <button id="new">New game</button>
  </div>
  <div class="grid" id="grid" role="group" aria-label="Cards"></div>
</main>
<div id="win" role="dialog" aria-modal="true" aria-labelledby="wt">
  <div>
    <h2 id="wt">All matched</h2>
    <p id="wp"></p>
    <button id="again" style="background:var(--accent);color:#14213d;font-weight:600">Play again</button>
  </div>
</div>
<script>
const SYMBOLS=["☀","☾","★","✦","❄","☁","⚡","✺","☄","♒","♈","♌"];
const grid=document.getElementById("grid"),movesEl=document.getElementById("moves"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best"),win=document.getElementById("win");
let pairs=8,first=null,lock=false,moves=0,matched=0,timer=null,start=0;

function getBest(){try{return JSON.parse(localStorage.getItem("skymatch-best")||"{}")}catch(e){return {}}}
function setBest(v){try{localStorage.setItem("skymatch-best",JSON.stringify(v))}catch(e){}}
function showBest(){const b=getBest()[pairs];bestEl.textContent=b?b+" moves":"-"}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newGame(){
  clearInterval(timer);timer=null;first=null;lock=false;moves=0;matched=0;
  movesEl.textContent=0;timeEl.textContent="0:00";win.classList.remove("show");showBest();
  const cols=pairs===12?6:4;grid.style.setProperty("--cols",cols);
  const deck=shuffle([...SYMBOLS.slice(0,pairs),...SYMBOLS.slice(0,pairs)]);
  grid.innerHTML="";
  deck.forEach(s=>{
    const c=document.createElement("button");
    c.className="card";c.dataset.s=s;c.setAttribute("aria-label","Hidden card");
    c.innerHTML='<span class="in"><span class="b">?</span><span class="f">'+s+'</span></span>';
    c.addEventListener("click",()=>flip(c));
    grid.appendChild(c);
  });
}

function flip(c){
  if(lock||c.classList.contains("up"))return;
  if(!timer){start=Date.now();timer=setInterval(()=>{timeEl.textContent=fmt(Math.floor((Date.now()-start)/1000))},500)}
  c.classList.add("up");c.setAttribute("aria-label","Card "+c.dataset.s);
  if(!first){first=c;return}
  moves++;movesEl.textContent=moves;
  if(first.dataset.s===c.dataset.s){
    first.classList.add("ok");c.classList.add("ok");first=null;matched++;
    if(matched===pairs)finish();
  }else{
    lock=true;const a=first;first=null;
    setTimeout(()=>{a.classList.remove("up");c.classList.remove("up");a.setAttribute("aria-label","Hidden card");c.setAttribute("aria-label","Hidden card");lock=false},800);
  }
}

function finish(){
  clearInterval(timer);timer=null;
  const secs=Math.floor((Date.now()-start)/1000),b=getBest();
  let msg=moves+" moves in "+fmt(secs)+".";
  if(!b[pairs]||moves<b[pairs]){b[pairs]=moves;setBest(b);msg+=" New best!";showBest()}
  document.getElementById("wp").textContent=msg;
  setTimeout(()=>win.classList.add("show"),500);
}

document.querySelectorAll("#levels [data-n]").forEach(btn=>btn.addEventListener("click",()=>{
  pairs=+btn.dataset.n;
  document.querySelectorAll("#levels [data-n]").forEach(x=>x.setAttribute("aria-pressed",x===btn));
  newGame();
}));
document.getElementById("new").addEventListener("click",newGame);
document.getElementById("again").addEventListener("click",newGame);
newGame();
</script>
</body>
</html>
